<div class="container">
  <aside class="sidebar">
    <h2>Account settings</h2>
    <ul>
      <li class="active">Profile Settings</li>
      <li>Password</li>
      <li>Notifications</li>
      <!-- <li>Verification</li> -->
    </ul>
  </aside>

  <main class="main-content">
    <div class="profile-section">
        <div class="avatar-container">
            <img [src]="avatarPreview" alt="Avatar" />
            <input type="file" #avatarUpload accept="image/*" hidden (change)="onFileSelected($event)" />
            <button id="uploadBtn" (click)="triggerFileInput()">Upload New</button>
            <button id="deleteBtn" class="delete" (click)="deleteAvatar()">Delete Avatar</button>
        </div>



      <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" placeholder="First name" [(ngModel)]="user.firstName" name="firstName" [disabled]="!isEditing" required />
          </div>
          <div class="form-group">
            <label>Middle Name</label>
            <input type="text" placeholder="Middle name" [(ngModel)]="user.middleName" name="middleName" [disabled]="!isEditing" />
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" placeholder="Last name" [(ngModel)]="user.lastName" name="lastName" [disabled]="!isEditing" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="example@gmail.com" [(ngModel)]="user.email" name="email" [disabled]="!isEditing" />
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" placeholder="0000000000" [(ngModel)]="user.mobile" name="mobile" disabled />
          </div>
          <div class="form-group">
            <label>Alternative Mobile Number</label>
            <input type="tel" placeholder="0000000000" [(ngModel)]="user.altMobile" #altMobile="ngModel"
            pattern="^[0-9]{10}$" name="altMobile" [disabled]="!isEditing" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Country</label>
            <input type="text" [(ngModel)]="user.country" name="country" disabled />
          </div>
        </div>



        <div class="form-row">
          <div class="form-group">
            <label>State</label>
            <input type="text" [(ngModel)]="user.state" name="state" [disabled]="!isEditing" />
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" [(ngModel)]="user.city" name="city" [disabled]="!isEditing" />
          </div>
          <div class="form-group">
            <label>Pin Code</label>
            <input type="text" [(ngModel)]="user.zip" name="zip" [disabled]="!isEditing" />
          </div>

        </div>
        <div class="form-group full">
          <label>Residential Address line 1</label>
          <input type="text" placeholder="Address line 1" [(ngModel)]="user.address1" name="address1" [disabled]="!isEditing" />
        </div>
        <div class="form-group full">
          <label>Residential Address line 2</label>
          <input type="text" placeholder="Address line 2" [(ngModel)]="user.address2" name="address2" [disabled]="!isEditing" />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Landmark</label>
                <input type="text" [(ngModel)]="user.landmark" name="landmark" [disabled]="!isEditing" />
            </div>
        </div>

        <!-- Buttons -->
        <div class="form-actions">
          <button type="button" *ngIf="!isEditing" (click)="toggleEdit()"><span class="icon">✏️</span> Edit</button>
          <button type="submit" *ngIf="isEditing">Save</button>
          <button type="button" *ngIf="isEditing" (click)="toggleEdit()">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</div>
