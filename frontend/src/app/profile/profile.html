<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>profile page</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Account settings</h2>
      <ul>
        <li class="active">Profile Settings</li>
        <li>Password</li>
        <li>Notifications</li>
        <li>Verification</li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="profile-section">
        <div class="avatar-container">
          <img id="avatarPreview" src="https://via.placeholder.com/100" alt="Avatar" />
          <input type="file" id="avatarUpload" accept="image/*" hidden />
          <button id="uploadBtn">Upload New</button>
          <button id="deleteBtn" class="delete">Delete Avatar</button>
        </div>

        <form id="profileForm">
          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" placeholder="First name" required />
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" placeholder="Last name" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="example@gmail.com" />
            </div>
            <div class="form-group">
              <label>Mobile Number *</label>
              <div class="phone-input">
                <span class="flag">🇳🇬</span>
                <input type="tel" placeholder="0806 123 7890" required />
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group gender">
              <label>Gender</label>
              <div class="gender-options">
                <label><input type="radio" name="gender" /> Male</label>
                <label><input type="radio" name="gender" /> Female</label>
              </div>
            </div>
            <div class="form-group">
              <label>ID</label>
              <input type="text" placeholder="1559 000 7788 8DER" disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Tax Identification Number</label>
              <input type="text" placeholder="Enter TIN" />
            </div>
            <div class="form-group">
              <label>Tax Identification Country</label>
              <div class="country-input">
                <span class="flag">🇳🇬</span>
                <input type="text" value="India" disabled />
              </div>
            </div>
          </div>

          <div class="form-group full">
            <label>Residential Address</label>
            <input type="text" placeholder="1b street orogun Ibadan" />
          </div>

          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>
    </main>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
